<!DOCTYPE html>
<html>
<head>
    <title>Edit Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h3>Edit Warning Threshold</h3>
<form method="POST">
    <label>Max % before warning:</label>
    <input type="number" name="max_percentage" value="{{ max_percentage }}" class="form-control" step="1">
    <label for="budget">Monthly Budget Goal ($)</label>
    <input type="number" class="form-control" name="monthly_budget_goal" value="{{ monthly_budget_goal }}">
    <button class="btn btn-primary mt-3">Save</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-danger mt-3">Cancel</button>
</form>

</body>
</html>
