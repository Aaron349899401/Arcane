<!DOCTYPE html>
<html>
<head>
    <title>Add Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h3>Add New Transaction</h3>
<form method="POST">
    <select name="type" class="form-control mb-3" required>
        <option value="Income">Income</option>
        <option value="Expense">Expense</option>
    </select>
    <input name="category" class="form-control mb-3" placeholder="Category" required>
    <input name="amount" type="number" step="0.01" class="form-control mb-3" placeholder="Amount" required>
    <button class="btn btn-success">Submit</button>
    <a href="/dashboard" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
