<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Uploaded Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Your Uploaded Files</h2>
    <a href="{{ url_for('upload') }}" class="btn btn-success mb-3">Upload New Files</a>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mb-3 ms-2">Back to Dashboard</a>

    {% if files %}
        <div class="row row-cols-1 row-cols-md-3 g-3">
            {% for file in files %}
                <div class="col">
                    <div class="card shadow-sm">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <span>{{ file[0] }}</span>
                            <a href="{{ url_for('uploaded_file', filename=file[0]) }}" class="btn btn-outline-primary btn-sm" target="_blank">View / Download</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-info">No files uploaded yet.</div>
    {% endif %}
</div>

</body>
</html>
