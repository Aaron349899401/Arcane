<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<nav class="mb-4">
    <a href="/dashboard" class="btn btn-secondary">Home</a>
    <a href="/addNewData" class="btn btn-success">Add</a>
    <a href="/uploadFile" class="btn btn-info">Upload File</a>
    <a href="/viewFile" class="btn btn-warning">View Files</a>
    <a href="/viewReport" class="btn btn-dark">View Report</a>
    <a href="/logout" class="btn btn-danger float-end">Logout</a>
</nav> 

<h3>Income / Expense Table</h3>
<table class="table table-bordered table-striped text-center">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>${{ row[3] }}</td>
            <td>
                <a href="/editdata/{{ row[0] }}" class="btn btn-sm btn-primary">Edit</a>
                <a href="/deletedata/{{ row[0] }}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
